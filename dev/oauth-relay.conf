# Local OAuth relay (make oauth-relay): one fixed callback, http://localhost:2999/api/v1/auth/<provider>/callback,
# registered once at Google and GitHub for every local checkout. The api prefixes state with its own web port
# ("3100-<random>"); this sends the browser on to that port with the query untouched. Never deployed.
server {
    listen 80;
    location ~ ^/api/v1/auth/[a-z]+/callback$ {
        if ($arg_state ~ "^([0-9]{2,5})-") {
            return 302 http://localhost:$1$request_uri;
        }
        return 400;
    }
    location / {
        return 404;
    }
}
