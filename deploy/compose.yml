# Production stack on tolerance.cc (/opt/tolerance on 81.27.103.131). Shipped and started by
# .github/workflows/deploy.yml through deploy/server.sh — not used locally (that's ../docker-compose.yml).
# Images come from GHCR at ${TAG}, a commit sha; server.sh writes TAG into /opt/tolerance/.env.
#
# Project name `tolerance` keeps the volumes and the tolerance_default network that mentor.nualimov.dev's
# Caddy (mentor-web, /root/nualimov.dev) joins.

name: tolerance

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-image: &backend ghcr.io/tolerance-dev/tolerance-backend:${TAG:?}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: arena_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arena
    volumes:
      - arena-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_migrate -d arena"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot, run by server.sh (`run --rm migrate`) before api is replaced; the profile keeps `up` from starting it.
  migrate:
    image: *backend
    profiles: [tools]
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      ARENA_MIGRATE_DATABASE_URL: postgres://arena_migrate:${POSTGRES_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_APP_ROLE_PASSWORD: ${ARENA_APP_ROLE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  # The HTTP API. Runs are the worker's (below), so replacing the api leaves them going. docker.sock: deleting a run
  # removes its snapshot image.
  api:
    image: *backend
    restart: unless-stopped
    logging: *logging
    environment:
      ARENA_ADDR: 0.0.0.0:8080
      ARENA_ALLOW_NON_LOOPBACK: "true"
      ARENA_APP_DATABASE_URL: postgres://arena_app:${ARENA_APP_ROLE_PASSWORD}@postgres:5432/arena?sslmode=disable&pool_max_conns=${ARENA_DB_POOL_MAX:-20}
      ARENA_SECRET_KEY: ${ARENA_SECRET_KEY:?}
      ARENA_SECURE_COOKIES: "true"
      ARENA_TRUST_PROXY: "true"
      ARENA_ADMIN_EMAILS: ${ARENA_ADMIN_EMAILS:-}
      # The owner (ownerEmail in cmd/api/config.go), nobody else, may key agents with their Claude / ChatGPT subscription.
      ARENA_SUBSCRIPTIONS: "true"
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:?}
      # Live preview address of a run ({id} = its hex); Caddy sends *.${ARENA_DOMAIN} to the gateway.
      ARENA_PREVIEW_URL: https://p-{id}.${ARENA_DOMAIN:?}
      # Queue positions and waits, and the stuck-queue alert, count on this many slots: the worker's own value.
      ARENA_RUN_CONCURRENCY: ${ARENA_RUN_CONCURRENCY:-2}
      # Alerts (internal/alerts) also go to this Telegram chat when both are set; else only to the log.
      ARENA_ALERT_TELEGRAM_TOKEN: ${ARENA_ALERT_TELEGRAM_TOKEN:-}
      ARENA_ALERT_TELEGRAM_CHAT: ${ARENA_ALERT_TELEGRAM_CHAT:-}
      ARENA_GITHUB_CLIENT_ID: ${ARENA_GITHUB_CLIENT_ID:-}
      ARENA_GITHUB_CLIENT_SECRET: ${ARENA_GITHUB_CLIENT_SECRET:-}
      ARENA_GOOGLE_CLIENT_ID: ${ARENA_GOOGLE_CLIENT_ID:-}
      ARENA_GOOGLE_CLIENT_SECRET: ${ARENA_GOOGLE_CLIENT_SECRET:-}
      # The hidden checks (worker below) only for their count on the task page.
      ARENA_TASKS_HIDDEN_DIR: /tasks-hidden
    # Group that owns docker.sock on the host.
    group_add: ["${DOCKER_GID:?}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tasks-hidden:/tasks-hidden:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The runs worker: claims queued runs and starts their agent/check containers from arena-runtime:1 through
  # docker.sock. On SIGTERM it takes no new runs and lets the ones in flight finish (ARENA_WORKER_DRAIN), so a stop
  # waits up to stop_grace_period; server.sh swaps it in the background after the rest of a deploy.
  worker:
    image: *backend
    command: ["worker"]
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 65m
    environment:
      ARENA_APP_DATABASE_URL: postgres://arena_app:${ARENA_APP_ROLE_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_RUN_CONCURRENCY: ${ARENA_RUN_CONCURRENCY:-2}
      ARENA_WORKER_DRAIN: 60m
      # Sandbox hardening, off until the host has it (deploy/README.md): runsc = gVisor; a disk cap per container.
      ARENA_SANDBOX_RUNTIME: ${ARENA_SANDBOX_RUNTIME:-}
      ARENA_SANDBOX_DISK: ${ARENA_SANDBOX_DISK:-}
      # Hidden checks, <task>/checks.json (deploy/README.md); an empty directory = the public checks only.
      ARENA_TASKS_HIDDEN_DIR: /tasks-hidden
    # Group that owns docker.sock on the host.
    group_add: ["${DOCKER_GID:?}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tasks-hidden:/tasks-hidden:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The sandboxes' only way out (LLM APIs with the real keys, npm/PyPI mirrors), and the live previews on 8091:
  # p-<run>.${ARENA_DOMAIN} through Caddy.
  gateway:
    image: *backend
    command: ["gateway"]
    restart: unless-stopped
    logging: *logging
    environment:
      ARENA_APP_DATABASE_URL: postgres://arena_app:${ARENA_APP_ROLE_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_SECRET_KEY: ${ARENA_SECRET_KEY:?}
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:?}
      ARENA_PREVIEW_DOMAIN: ${ARENA_DOMAIN:?}
      ARENA_PREVIEW_PREFIX: p-
      ARENA_SUBSCRIPTIONS: "true"
      # Live previews at once, 512 MB each, next to ARENA_RUN_CONCURRENCY agents of up to 6 GB on a 16 GB host.
      ARENA_PREVIEW_MAX: ${ARENA_PREVIEW_MAX:-6}
      ARENA_SANDBOX_RUNTIME: ${ARENA_SANDBOX_RUNTIME:-}
      ARENA_SANDBOX_DISK: ${ARENA_SANDBOX_DISK:-}
    group_add: ["${DOCKER_GID:?}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The worker finds the gateway by this label and attaches it to each run's internal network.
    labels:
      arena.gateway: arena
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/tolerance-dev/tolerance-web:${TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://api:8080
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:?}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Ships the stack's logs to Grafana Cloud (config.alloy). Off unless .env has COMPOSE_PROFILES=logs and the
  # GRAFANA_LOKI_* values (deploy/README.md).
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [logs]
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  # caddy + the Bunny DNS module (caddy/Dockerfile): Let's Encrypt certificates through DNS-01, see the Caddyfile.
  caddy:
    image: ghcr.io/tolerance-dev/tolerance-caddy:${TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      ARENA_DOMAIN: ${ARENA_DOMAIN:?}
      BUNNY_API_KEY: ${BUNNY_API_KEY:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - arena-caddy-data:/data
    depends_on:
      - web
      - gateway

volumes:
  arena-postgres-data:
  arena-caddy-data:
  alloy-data:
