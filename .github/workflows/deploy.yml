name: deploy

# One button: Actions → deploy → Run workflow (or `gh workflow run deploy [-f ref=<sha>] [-f reset_db=true]`).
# Builds the backend, web and sandbox runtime images at the chosen commit (default: HEAD of main), pushes them to
# GHCR, ships deploy/compose.yml, deploy/Caddyfile and deploy/server.sh to /opt/tolerance on the server, then runs
# `server.sh deploy <sha>` there: DB dump, migrations, api/gateway/web swap, health check, automatic return to the
# previous tag if the new one is unhealthy. Rollback by hand = run it again with an older sha in `ref`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to deploy (empty = main)
        required: false
        default: ""
      reset_db:
        description: Wipe the database first (needed after a schema change; server.sh dumps it first and loads users and agents back)
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/tolerance-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: resolve sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-backend:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            API_URL=http://api:8080
          tags: ${{ env.REGISTRY }}/tolerance-web:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # arena-runtime:1 on the server: every agent and check container starts from it.
      - name: sandbox runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-runtime:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config

      - name: ship config
        # --inplace: compose.yml and Caddyfile are single-file bind mounts, a new inode would leave containers on
        # the old content.
        run: rsync -c --inplace deploy/compose.yml deploy/Caddyfile deploy/server.sh prod:/opt/tolerance/

      # The packages may be private; this job's token lets the server pull them (it expires with the job).
      - name: registry login on the server
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | ssh prod "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: deploy on the server
        run: ssh prod "bash /opt/tolerance/server.sh deploy ${{ steps.sha.outputs.sha }} ${{ inputs.reset_db && 'reset' || '' }}"

      - name: registry logout on the server
        if: always()
        run: ssh prod "docker logout ghcr.io" || true

      - name: purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -c '{success, errors}'

      - name: public check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null https://tolerance.cc/api/v1/healthz && curl -fsS -o /dev/null https://tolerance.cc/; then
              echo "https://tolerance.cc is up at ${{ steps.sha.outputs.sha }}"; exit 0
            fi
            sleep 3
          done
          echo "https://tolerance.cc did not answer" >&2; exit 1
