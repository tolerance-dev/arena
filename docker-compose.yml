# What `make dev` runs in Docker: postgres, and the gateway (the sandboxes' only way out to LLM APIs, npm and
# PyPI, and the live previews on :${GATEWAY_PORT}). The api, the runs worker and the web run natively.
#
# Production uses deploy/compose.yml (see .github/workflows/deploy.yml).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arena
    volumes:
      - arena-postgres-data:/var/lib/postgresql/data
    ports:
      # For native `make dev`; change PG_PORT if another stack holds 5432.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_migrate -d arena"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    # No image name: compose tags the build <project>-gateway, so each checkout runs the gateway built from its own
    # code. A shared tag let one checkout's build replace another's gateway on its next `up`.
    build: ./backend
    command: ["gateway"]
    restart: unless-stopped
    environment:
      ARENA_APP_DATABASE_URL: postgres://arena_app:${ARENA_APP_ROLE_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_SECRET_KEY: ${ARENA_SECRET_KEY:-dev-only-secret-key-change-me}
      ARENA_SUBSCRIPTIONS: ${ARENA_SUBSCRIPTIONS:-false}
      ARENA_STACK: ${ARENA_STACK:-arena}
      ARENA_GATEWAY_FAKE: ${ARENA_GATEWAY_FAKE:-false}
      ARENA_PREVIEW_DOMAIN: preview.localhost
      ARENA_PREVIEW_MAX: ${ARENA_PREVIEW_MAX:-6}
      ARENA_SANDBOX_RUNTIME: ${ARENA_SANDBOX_RUNTIME:-}
      ARENA_SANDBOX_DISK: ${ARENA_SANDBOX_DISK:-}
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:-http://localhost:${WEB_PORT:-3000}}
    user: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The worker finds the gateway by this label and attaches it to each run's internal network.
    labels:
      arena.gateway: ${ARENA_STACK:-arena}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3023}:8091"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  arena-postgres-data:
